[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-morse-generator"
version = "6.1.0"
requires-python = ">=3.13"
dependencies = ["lameenc==1.8.4", "cryptography==49.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "PyInstaller==6.11.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
